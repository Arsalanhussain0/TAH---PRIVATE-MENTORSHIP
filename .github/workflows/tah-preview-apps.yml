name: TAH Live Apps
on:
  push:
    branches: [feature/tah-lecture-access]
    paths: ['apps/**', '.github/workflows/tah-preview-apps.yml']
permissions:
  contents: read
env:
  TAH_WINDOWS_VERSION: "1.2.0"
  TAH_ANDROID_VERSION_CODE: "3"
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - env:
          TAH_ANDROID_KEYSTORE_B64: ${{ secrets.TAH_ANDROID_KEYSTORE_B64 }}
          TAH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TAH_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          mkdir -p apps/android/app/src/main/res/drawable-nodpi
          cp icon-512.png apps/android/app/src/main/res/drawable-nodpi/tah_logo.png
          gradle -p apps/android :app:assembleRelease
          if [[ -n "$TAH_ANDROID_KEYSTORE_B64" && -n "$TAH_ANDROID_KEYSTORE_PASSWORD" ]]; then
            umask 077
            printf '%s' "$TAH_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/tah-release.p12"
            trap 'rm -f "$RUNNER_TEMP/tah-release.p12"' EXIT
          fi
          mkdir -p output
          for flavor in student admin; do
            filename="TAH-${flavor^}-Android-Live.apk"
            tools="$ANDROID_HOME/build-tools/35.0.0"
            unsigned="apps/android/app/build/outputs/apk/$flavor/release/app-$flavor-release-unsigned.apk"
            if [[ ! -f "$RUNNER_TEMP/tah-release.p12" ]]; then
              cp "$unsigned" "output/${filename%.apk}-unsigned.apk"
              continue
            fi
            "$tools/zipalign" -P 16 -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
            "$tools/apksigner" sign --ks "$RUNNER_TEMP/tah-release.p12" --ks-pass env:TAH_ANDROID_KEYSTORE_PASSWORD --ks-key-alias tah-release --out "output/$filename" "$RUNNER_TEMP/aligned.apk"
            "$tools/apksigner" verify "output/$filename"
          done
      - uses: actions/upload-artifact@v4
        with: {name: TAH-Android-Live, path: 'output/*.apk', if-no-files-found: error}
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        portal: [Student, Admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Build and package
        shell: pwsh
        env:
          PORTAL: ${{ matrix.portal }}
        run: |
          python -m pip install Pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from PIL import Image; Image.open('icon-512.png').convert('RGBA').save('apps/windows/TAH.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $publish = Join-Path $env:RUNNER_TEMP "publish"
          $output = Join-Path $env:GITHUB_WORKSPACE "output"
          $define = if ($env:PORTAL -eq 'Admin') { 'TAH_ADMIN' } else { 'TAH_STUDENT' }
          dotnet publish apps/windows/TAH.csproj -c Release -r win-x64 --self-contained true -o $publish "-p:DefineConstants=$define" "-p:Version=$env:TAH_WINDOWS_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          & $iscc "/DPortal=$env:PORTAL" "/DVersion=$env:TAH_WINDOWS_VERSION" "/DPublish=$publish" "/DOutput=$output" "/DIcon=$env:GITHUB_WORKSPACE\apps\windows\TAH.ico" apps/windows/setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with: {name: 'TAH-${{ matrix.portal }}-Windows-Live', path: 'output/*.exe', if-no-files-found: error}

  publish-windows:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: tah-windows-release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'TAH-*-Windows-Live'
          path: release
          merge-multiple: true
      - name: Publish versioned Windows installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          tag="tah-windows-v${TAH_WINDOWS_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          gh release create "$tag" release/TAH-Student-Windows-Live-Setup.exe release/TAH-Admin-Windows-Live-Setup.exe --target "$RELEASE_COMMIT" --latest --title "TAH Windows ${TAH_WINDOWS_VERSION}" --notes "Student and Admin installers. Includes verified update checks."

  publish-android:
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: tah-android-release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TAH-Android-Live
          path: release
      - name: Publish signed APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if [[ ! -f release/TAH-Student-Android-Live.apk || ! -f release/TAH-Admin-Android-Live.apk ]]; then
            echo "Permanent signing secrets are required to publish APKs."
            exit 0
          fi
          tag="tah-android-v${TAH_ANDROID_VERSION_CODE}"
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          gh release create "$tag" release/TAH-Student-Android-Live.apk release/TAH-Admin-Android-Live.apk --target "$RELEASE_COMMIT" --latest=false --title "TAH Android build ${TAH_ANDROID_VERSION_CODE}" --notes "Signed Student and Admin APKs with in-app update checks."

name: TAH
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  TAHStudent:
    type: application
    platform: iOS
    sources: [Portal.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theapexhouse.preview.student
        INFOPLIST_KEY_CFBundleDisplayName: TAH Student Preview
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  TAHAdmin:
    type: application
    platform: iOS
    sources: [Portal.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theapexhouse.preview.admin
        INFOPLIST_KEY_CFBundleDisplayName: TAH Admin Preview
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: TAH_ADMIN
